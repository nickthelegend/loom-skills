name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate skill files
        run: node scripts/validate.mjs
      - name: Check shell syntax
        run: sh -n install.sh
      - name: Lint installer
        run: shellcheck install.sh
